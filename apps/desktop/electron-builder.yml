{
  "appId": "com.axstudio.desktop",
  "productName": "AX Studio",
  "electronVersion": "44.5.1",
  "npmRebuild": false,
  "electronDist": "../../node_modules/electron/dist",
  "directories": {
    "output": "release",
    "buildResources": "build"
  },
  "files": [
    "out/**/*",
    "package.json",
    "!node_modules/@ax-studio/core{,/**/*}",
    {
      "from": "../../node_modules/undici",
      "to": "node_modules/undici",
      "filter": ["**/*"]
    }
  ],
  "asar": true,
  "extraResources": [
    {
      "from": "../../LICENSE",
      "to": "LICENSE.AX-Studio.txt"
    },
    {
      "from": "../../THIRD_PARTY_NOTICES.md",
      "to": "THIRD_PARTY_NOTICES.md"
    },
    {
      "from": "../../docs/PACKAGING_NOTICES.md",
      "to": "PACKAGING_NOTICES.md"
    },
    {
      "from": "../../packages/document-engine/out/document-engine",
      "to": "document-engine",
      "filter": ["**/*"]
    }
  ],
  "electronFuses": {
    "runAsNode": false,
    "enableNodeOptionsEnvironmentVariable": false,
    "enableEmbeddedAsarIntegrityValidation": true,
    "onlyLoadAppFromAsar": true
  },
  "win": {
    "target": [
      {
        "target": "nsis",
        "arch": ["x64"]
      }
    ],
    "icon": "build/icon.ico",
    "signAndEditExecutable": true,
    "signtoolOptions": {
      "signingHashAlgorithms": ["sha256"],
      "rfc3161TimeStampServer": "http://timestamp.digicert.com"
    }
  },
  "nsis": {
    "artifactName": "AX-Studio-Setup-${version}.${ext}",
    "oneClick": false,
    "allowToChangeInstallationDirectory": true
  },
  "mac": {
    "target": ["dmg"],
    "icon": "build/icon.png",
    "identity": null
  },
  "linux": {
    "target": [
      {
        "target": "AppImage",
        "arch": ["x64"]
      }
    ],
    "icon": "build/icon.png",
    "executableName": "ax-studio",
    "category": "Office"
  },
  "publish": [
    {
      "provider": "github",
      "owner": "shinyeonjun",
      "repo": "AX_studio",
      "releaseType": "release"
    }
  ],
  "afterPack": "scripts/after-pack-linux.mjs",
  "appImage": {
    "executableArgs": []
  }
}
