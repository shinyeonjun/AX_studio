{
  "appId": "com.axstudio.desktop",
  "productName": "AX Studio",
  "electronVersion": "44.3.0",
  "npmRebuild": false,
  "electronDist": "../../node_modules/electron/dist",
  "directories": {
    "output": "release",
    "buildResources": "build"
  },
  "files": [
    "out/**/*",
    "package.json",
    {
      "from": "../../node_modules/undici",
      "to": "node_modules/undici",
      "filter": ["**/*"]
    }
  ],
  "asar": true,
  "extraResources": [
    { "from": "../../THIRD_PARTY_NOTICES.md", "to": "THIRD_PARTY_NOTICES.md" },
    { "from": "../../packages/document-engine/out/document-engine", "to": "document-engine", "filter": ["**/*"] }
  ],
  "win": {
    "target": [
      {
        "target": "nsis",
        "arch": ["x64"]
      }
    ],
    "icon": "src/ui/images/AX_Studio.png",
    "signExecutable": false
  },
  "nsis": {
    "oneClick": false,
    "allowToChangeInstallationDirectory": true,
    "deleteAppDataOnUninstall": false
  },
  "mac": {
    "target": ["dmg"],
    "identity": null
  },
  "linux": {
    "target": ["AppImage"]
  }
}
