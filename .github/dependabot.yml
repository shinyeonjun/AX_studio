# Weekly dependency update PRs. Security advisories are raised as separate PRs as they appear.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /packages/document-engine
    schedule:
      interval: weekly
