name: Release

# Pushing a version tag (v0.2.0, v0.2.0-preview.1) builds the Windows installer and attaches it,
# with latest.yml, to that GitHub release. Installed apps read latest.yml to update themselves.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    name: windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match apps/desktop version $version" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Python for packaging
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build Core package
        run: npm run build -w @ax-studio/core

      - name: Build Windows installer
        run: npm run pack:win -w @ax-studio/desktop
        env:
          # Optional: set these repository secrets to sign the installer and to ship Gmail sign-in.
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}

      - name: Attach installer and update metadata to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd apps/desktop/release
          files=(latest.yml *.exe *.exe.blockmap)
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --title "AX Studio $GITHUB_REF_NAME" --generate-notes $prerelease
          fi
