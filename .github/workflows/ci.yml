name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Document engine dependencies
        run: python -m pip install -r packages/document-engine/requirements-test.txt

      - name: Document engine dependency security
        run: npm run audit:document-engine

      - name: Build Core package for dependent tests
        run: npm run build -w @ax-studio/core

      - name: Core tests
        run: npm test

      - name: Runtime and build dependency security
        run: npm audit --audit-level=low

      - name: Crash recovery and real HTTP delivery tests
        run: node --test test/release/reliability.test.mjs

      - name: Desktop tests
        run: npm run test:desktop

      - name: Desktop type check
        run: npm run typecheck:desktop

      - name: Product test type check
        run: npm run typecheck:tests

      - name: Document engine tests
        run: npm run test:document-engine

      - name: Real PDF reports and independent output verification
        run: npm run test:report-e2e -- --check-contract && npm run test:report-e2e
        env:
          AX_REPORT_E2E_ROOT: ${{ runner.temp }}/ax-report-generation-e2e

      - name: Upload PDF report failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-report-failure-${{ github.sha }}
          path: ${{ runner.temp }}/ax-report-generation-e2e/
          if-no-files-found: ignore
          retention-days: 7

      - name: Core evaluation
        run: npm run eval

      - name: Production build
        run: npm run build

      - name: Architecture check
        run: npm run arch:check

      - name: Unused code and dependencies
        run: npm run knip

      - name: Deterministic product smoke
        run: xvfb-run --auto-servernum npm run test:product-qa -- --mode deterministic --tier smoke --strict --skip-build

      - name: Check diff whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "origin/${{ github.base_ref }}...${{ github.sha }}"

      - name: Upload product QA artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: product-qa-runs
          path: test/product-qa/runs/
          if-no-files-found: ignore

  windows-desktop:
    name: windows desktop
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Python for packaging
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build Core package for dependent tests
        run: npm run build -w @ax-studio/core

      - name: Crash recovery and real HTTP delivery tests
        run: node --test test/release/reliability.test.mjs

      - name: Desktop tests
        run: npm run test:desktop

      - name: Desktop type check
        run: npm run typecheck:desktop

      - name: Product test type check
        run: npm run typecheck:tests

      - name: Windows package smoke
        run: npm run pack:win -w @ax-studio/desktop

      - name: Exact packaged Python dependency security
        shell: pwsh
        run: |
          python -m pip install pip-audit==2.10.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip_audit --strict --path apps/desktop/release/win-unpacked/resources/document-engine/python/Lib/site-packages

      - name: Packaged discovery, results, background search, Gmail setup and approval retention
        shell: pwsh
        run: |
          $env:AX_PRODUCT_QA_MODE = 'deterministic'
          $env:AX_PRODUCT_QA_ISOLATED = '1'
          $env:AX_PRODUCT_QA_EXECUTABLE = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/release/win-unpacked/AX Studio.exe'
          npx playwright test --config test/product-qa/playwright.config.ts release-lifecycle.spec.ts discovery-execution.spec.ts gmail-client-setup.spec.ts calculated-output.spec.ts background-search.spec.ts

      - name: Windows package identity and metadata
        shell: pwsh
        run: |
          $releaseVersion = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          ./test/release/package-metadata.ps1 -Executable 'apps/desktop/release/win-unpacked/AX Studio.exe' -Installer "apps/desktop/release/AX Studio Setup $releaseVersion.exe"

      - name: Real startup with damaged OS credentials and settings UI recovery
        shell: pwsh
        run: |
          $releaseScratch = Join-Path $env:RUNNER_TEMP ('ax-credential-acceptance-' + [guid]::NewGuid().ToString('N'))
          $releaseExecutable = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/release/win-unpacked/AX Studio.exe'
          node test/release/installed-app.mjs --executable $releaseExecutable --workspace $releaseScratch --corrupt-credential
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node test/release/installed-app.mjs --executable $releaseExecutable --workspace $releaseScratch --reopen

      - name: Real NSIS install, reinstall, uninstall and retained-data recovery
        shell: pwsh
        run: |
          $releaseVersion = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          ./test/release/windows-installer.ps1 -Installer "apps/desktop/release/AX Studio Setup $releaseVersion.exe"

      - name: Hash verified distribution assets
        shell: pwsh
        run: |
          $releaseVersion = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $releaseDirectory = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/release'
          $releaseAssets = @("AX Studio Setup $releaseVersion.exe", "AX Studio Setup $releaseVersion.exe.blockmap")
          $releaseHashes = foreach ($releaseAsset in $releaseAssets) {
            $releaseHash = Get-FileHash -LiteralPath (Join-Path $releaseDirectory $releaseAsset) -Algorithm SHA256
            "$($releaseHash.Hash.ToLowerInvariant())  $releaseAsset"
          }
          [IO.File]::WriteAllLines((Join-Path $releaseDirectory 'SHA256SUMS.txt'), $releaseHashes, [Text.UTF8Encoding]::new($false))

      - name: Upload verified Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ github.sha }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-acceptance-${{ github.sha }}
          path: |
            test/product-qa/runs/
            ${{ runner.temp }}/ax-credential-acceptance-*/**/acceptance.json
            ${{ runner.temp }}/ax-credential-acceptance-*/**/*.png
            ${{ runner.temp }}/ax-installer-check-*/**/acceptance.json
            ${{ runner.temp }}/ax-installer-check-*/**/*.png
          if-no-files-found: warn
          retention-days: 14
