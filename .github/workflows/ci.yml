name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm config set allow-remote all; npm ci

      - name: Document engine dependencies
        run: python -m pip install -r packages/document-engine/requirements.txt

      - name: Core tests
        run: npm test

      - name: Desktop tests
        run: npm run test:desktop

      - name: Desktop type check
        run: npm run typecheck:desktop

      - name: Document engine tests
        run: npm run test:document-engine

      - name: Core evaluation
        run: npm run eval

      - name: Production build
        run: npm run build

      - name: Architecture check
        run: npm run arch:check

      - name: Deterministic product smoke
        run: xvfb-run --auto-servernum npm run test:product-qa -- --mode deterministic --tier smoke --strict --skip-build

      - name: Check diff whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "origin/${{ github.base_ref }}...${{ github.sha }}"

      - name: Upload product QA artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: product-qa-runs
          path: test/product-qa/runs/
          if-no-files-found: ignore

  windows-desktop:
    name: windows desktop
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm config set allow-remote all; npm ci

      - name: Set up Python for packaging
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Desktop tests
        run: npm run test:desktop

      - name: Desktop type check
        run: npm run typecheck:desktop

      - name: Windows package smoke
        run: npm run pack:win -w @ax-studio/desktop
