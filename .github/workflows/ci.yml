name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Read-only Linux sandbox diagnostics
        shell: bash
        run: |
          id
          uname -a
          cat /etc/os-release
          printf 'ImageOS=%s ImageVersion=%s RUNNER_OS=%s RUNNER_ARCH=%s\n' \
            "${ImageOS:-<unset>}" "${ImageVersion:-<unset>}" "${RUNNER_OS:-<unset>}" "${RUNNER_ARCH:-<unset>}"
          for path in /proc/sys/kernel/unprivileged_userns_clone \
            /proc/sys/user/max_user_namespaces \
            /proc/sys/kernel/apparmor_restrict_unprivileged_userns \
            /proc/sys/kernel/apparmor_restrict_unprivileged_unconfined \
            /sys/module/apparmor/parameters/enabled /sys/kernel/security/lsm \
            "/proc/$$/attr/current"; do
            printf '%s: ' "$path"
            if [ -r "$path" ]; then cat "$path"; else printf '<absent or unreadable>\n'; fi
          done
          helper="$PWD/node_modules/electron/dist/chrome-sandbox"
          if [ -f "$helper" ]; then
            stat -Lc 'type=%F mode=%a uid=%u gid=%g path=%n' "$helper" "$(dirname "$helper")"
            sha256sum "$helper"
          else
            printf 'Electron sandbox helper absent: %s\n' "$helper"
          fi
          if command -v unshare >/dev/null && command -v timeout >/dev/null; then
            if timeout 5s unshare --user --map-root-user --pid --net --fork /bin/true; then
              printf 'unprivileged_namespace_probe_exit=0\n'
            else
              printf 'unprivileged_namespace_probe_exit=%s\n' "$?"
            fi
          else
            printf 'unprivileged namespace probe not run: unshare or timeout unavailable\n'
          fi

      - name: Packaging path and isolation regression tests
        run: npm run test:packaging

      - name: Installer safety and data preservation contracts (source only)
        run: npm run test:release:contracts

      - name: Document engine dependencies
        run: python -m pip install -r packages/document-engine/requirements.txt

      - name: Build Core package for dependent tests
        run: npm run build -w @ax-studio/core

      - name: Core tests
        run: npm test

      - name: Desktop tests
        run: npm run test:desktop

      - name: Desktop type check
        run: npm run typecheck:desktop

      - name: Document engine tests
        run: npm run test:document-engine

      - name: Core evaluation
        run: npm run eval

      - name: Production build
        run: npm run build

      - name: Architecture check
        run: npm run arch:check

      - name: Deterministic product smoke
        run: xvfb-run --auto-servernum npm run test:product-qa -- --mode deterministic --tier smoke --strict --skip-build

      - name: Check diff whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "origin/${{ github.base_ref }}...${{ github.sha }}"

      - name: Upload product QA artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: product-qa-runs
          path: test/product-qa/runs/
          if-no-files-found: ignore

  windows-desktop:
    name: windows desktop
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Packaging path and isolation regression tests
        run: npm run test:packaging

      - name: Installer safety and data preservation contracts (source only)
        run: npm run test:release:contracts

      - name: Parse installer PowerShell sources without execution
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem test/release/*.ps1) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }

      - name: Set up Python for packaging
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build Core package for dependent tests
        run: npm run build -w @ax-studio/core

      - name: Desktop tests
        run: npm run test:desktop

      - name: Desktop type check
        run: npm run typecheck:desktop

      - name: Windows package smoke
        run: npm run pack:win -w @ax-studio/desktop
