expansions:
  - date: 2026-08-23
    reason: "The previous whole-repository audit inspected the tree and added non-overlapping runtime, DB, connector, and UI work. Those dirty changes predate this architecture goal and are preserved."
    boundary: "existing dirty worktree"
  - date: 2026-08-23
    reason: "The new command service must be callable from both core agent/provider code and Electron IPC while reusing the existing catalog, workflow store, and Runtime."
    boundary: "agent/catalog/workflow/store/runtime/workspace plus desktop IPC/preload/chat"
  - date: 2026-08-24
    reason: "The Slack Socket Mode heartbeat warning originates in the core Slack trigger listener, which is outside the earlier command/runtime boundary."
    boundary: "packages/core/src/triggers/slack heartbeat configuration"
  - date: 2026-08-24
    reason: "The user-facing command entry point must replace slash parsing and render host-provided workflow input requests and registration controls in the workspace chat."
    boundary: "agent command result contract plus desktop workspace chat, hook, workflow preview, and IPC/preload types"
  - date: 2026-08-24
    reason: "One-shot execution needs a dedicated AI command and serialized ephemeral Runtime queue while preserving saved workflow boundaries."
    boundary: "agent commands plus core Runtime and bootstrap wiring"
  - date: 2026-08-24
    reason: "Rich controls must be opt-in through a host-validated UI command and stay attached to the assistant message instead of rendering as a global side panel."
    boundary: "agent command schema/service/chat loop, workspace chat persistence and IPC/preload contracts, desktop workspace renderer/hook"
  - date: 2026-08-24
    reason: "The OpenMausBot comparison confirms that user-facing lifecycle state belongs in the agent host command contract, not in slash-mode UI or chat persistence."
    boundary: "agent command access/schema/chat loop, workspace chat persistence and IPC/preload, presentation renderer, workflow view trigger display, provider command transports"
  - date: 2026-08-24
    reason: "The user added a product direction based on competitor gaps and recurring silent-degradation pain: learn recurring work from input/output examples and regression-check future results. This is queued as a separate bounded capability rather than mixed into the current command migration."
    boundary: "queued: example-bundle contract, hypothesis/replay/drift comparison, repair proposal, and bounded recurring-report UI; reuse catalog, Workflow IR, Docling evidence, Runtime, approval, and command chat"
  - date: 2026-08-24
    reason: "The user approved session-scoped document context: upload into the conversation session, persist source/artifact/Docling metadata, and expose only bounded ids to the agent."
    boundary: "session source repository/service, artifact ingest manifest, AxCommandService session-source reads, workspace chat IPC/preload/hook and source panel"
  - date: 2026-08-24
    reason: "The user requested maximum automated coverage of the real Electron user flow. A bounded test folder, Playwright harness, and AX_E2E-gated host seams are required because native file dialogs and external AI/connectors are not deterministic CI dependencies."
    boundary: "test/e2e, root test scripts/dependencies, Electron IPC/preload test seam, desktop data-root resolution"
  - date: 2026-08-24
    reason: "The user requested completing HTTP/REST, inbound Webhook, and read-only RDB support with real local-server and PostgreSQL/MySQL verification."
    boundary: "core HTTP/Webhook/RDB modules, desktop connector settings/connection IPC, test/integration, package dependencies, and Docker Compose fixtures"
  - date: 2026-08-24
    reason: "The user requested a developer-run smoke test combining the local REST API and PostgreSQL fixture with the already-connected Gmail/Slack connectors."
    boundary: "test/manual REST fixture, PostgreSQL-only Compose fixture, manual test runner/README, root test script, and harness records; no production connector expansion"
  - date: 2026-08-25
    reason: "The user approved layered Agent context: AGENTS.md and soul.md for stable behavior, session memo for temporary agreements, and workflow policy for durable per-workflow rules."
    boundary: "packages/core/src/agent context loading and prompt assembly, workspace chat persistence, workflow metadata persistence, and focused tests; no policy editor UI"
  - date: 2026-08-25
    reason: "The user requested separating uploaded PDF registration and Docling processing from interactive chat, while checking adjacent concrete coupling in the same source/chat/command path."
    boundary: "workspace source service queue/status lifecycle, session source command readiness, desktop source IPC/preload/hook/panel state, focused Core and Electron E2E tests; no document-engine or external connector changes"
  - date: 2026-08-25
    reason: "The user requested a real HTTP write path after the low-level connector already supported POST but the agent catalog exposed only a read-shaped generic request."
    boundary: "core HTTP catalog/connector/read-gateway guard, workflow/one-shot approval regression tests, command skill and manual REST documentation, and local integration coverage; DELETE/PUT/PATCH and external side effects remain excluded"
  - date: 2026-08-25
    reason: "The user requested realistic repeated product QA that measures user-flow regressions such as starting a new conversation while a previous response is still in flight."
    boundary: "data-driven product QA scenarios, Playwright runner/reporter, deterministic E2E seam configuration, package script, and QA documentation; no real external connector calls or production behavior changes"
  - date: 2026-08-25
    reason: "The first product QA replay reproduced a deterministic loss: starting a new conversation cancelled the previous session's in-flight response. The user-flow contract requires the old request to remain persisted without updating the new session UI."
    boundary: "apps/desktop/src/hooks/useWorkspaceChat.ts request/session persistence boundary; no provider, connector, or Runtime changes"
  - date: 2026-08-25
    reason: "The user asked to isolate npm run dev data from the packaged app and harden Gmail OAuth before cutting a dogfood RC."
    boundary: "desktop data-paths/app identity, Gmail OAuth loopback/state, env-file/example, electron-vite client_id bake, README; no HTTP connector expansion"
  - date: 2026-08-25
    reason: "Installed AX Studio crashed on launch because electron-builder omitted the Slack socket-mode peerDependency undici from app.asar."
    boundary: "desktop/core package.json, electron-builder files, lockfile; pack verification only"
  - date: 2026-08-25
    reason: "After undici was packed, the installed app failed on the dogfood SQLite schema: executions still used skill_id. The user also asked for a single release/ output folder."
    boundary: "packages/core/src/store/db.ts plus migration test; pack output remains apps/desktop/release"
  - date: 2026-08-25
    reason: "Dev and packaged dogfood had empty logs folders; the user asked to persist app/agent logs to files before further workflow debugging."
    boundary: "core app-log + desktop main file-log install; command-chat/harness failure lines; no log viewer UI"
  - date: 2026-08-25
    reason: "Dogfood Daily Dev Brief burned the 8-round command loop on list/create/update/run. User approved job registration as a host transaction: one job.propose spec, confirmation card, host commit without another LLM loop."
    boundary: "agent command schema/service/chat, job compile to Workflow IR, SKILL.md, desktop confirm_job intercept; no max-round bump, no multi-HTTP, no pack"
  - date: 2026-08-25
    reason: "job.propose compiles http.request GET, but catalog omits a fixed sideEffect while the contract validator compared the raw catalog undefined value. Persistence requires the method-resolved NONE/EXTERNAL level."
    boundary: "packages/core/src/workflow/contract-validator.ts sideEffect comparison uses resolveEffectiveSideEffect"
  - date: 2026-08-25
    reason: "Dogfood one-shot run failed immediately: stored workflow-document reload defaulted http.request GET to EXTERNAL, then contract validation required NONE."
    boundary: "packages/core/src/workflow/persisted-document.ts enrichActionStep uses resolveEffectiveSideEffect"
  - date: 2026-08-25
    reason: "User asked to store multiple HTTP APIs in settings and bind one onto a saved job so nightly runs do not pick again."
    boundary: "HTTP endpoint list in connection config/secrets, HttpConnector connectionId, job.propose persist connectionId, settings list add/remove; no arbitrary URLs, no pack"
  - date: 2026-08-25
    reason: "User asked for a whole-product finishing pass (not HTTP only): audit core engine, agent command plane, and desktop UI/electron for concrete defects and close them."
    boundary: "verified finishing defects anywhere in packages/core/src, apps/desktop/electron, apps/desktop/src; fixes only, no new features or subsystem rewrites"

ci_required_verification:
  include:
    - .github/workflows/ci.yml
    - .github/pull_request_template.md
    - .harness/goal.md
    - .harness/scope.yaml
    - .harness/evaluator.yaml
    - .harness/experiments.tsv
  exclude:
    - test/e2e
    - test/integration
    - live Gmail, Slack, AI, HTTP, and database calls
    - unrelated dirty worktree changes
  rationale: "Add only a truthful merge gate around checks that exist and are deterministic on CI; missing runners remain explicit gaps."

