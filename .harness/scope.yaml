  - packages/core/src/agent/skills
  - packages/core/src/agent/context-builders.ts
  - packages/core/src/agent/harness.ts
  - packages/core/src/agent/model
  - packages/core/src/agent/roles.ts
  - packages/core/src/catalog
  - packages/core/src/design-tools
  - packages/core/src/workspace
  - packages/core/src/agent
