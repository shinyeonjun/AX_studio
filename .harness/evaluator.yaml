    - name: command-and-catalog-regressions
      type: command
      command: npm test -w @ax-studio/core -- --run src/agent/commands/service.test.ts src/workflow/action-definition.test.ts src/catalog/capability-graph.test.ts
      required: true
    - name: connector-integration
      type: command
      command: npm run test:integration
      required: true
