version: 1
status: active
frozen: true

# Audit evaluator: establish this baseline before interpretation is finalized.
checks:
  - name: core-tests
    type: command
    command: npm test -w @ax-studio/core
    required: true
  - name: core-typecheck
    type: command
    command: npx tsc -p packages/core/tsconfig.json --noEmit
    required: true
  - name: desktop-typecheck
    type: command
    command: npx tsc -p apps/desktop/tsconfig.json --noEmit
    required: true
  - name: core-eval
    type: command
    command: npm run eval -w @ax-studio/core
    required: true
  - name: document-engine-tests
    type: command
    command: python -m unittest discover -s packages/document-engine/src -p '*_test.py' -v
    required: true
  - name: production-build
    type: command
    command: npm run build
    required: true
  - name: diff-whitespace
    type: command
    command: git diff --check
    required: true

metrics:
  - name: source-file-count-by-extension
    type: shell-derived
    command: rg --files -g '!node_modules' -g '!dist' -g '!out' -g '!coverage' -g '!tmp'
  - name: test-file-count
    type: shell-derived
    command: rg --files packages apps test -g '*test*' -g '*spec*'
  - name: dependency-and-risk-markers
    type: shell-derived
    command: rg -n 'TODO|FIXME|HACK|any|eval\(|new Function|dangerouslySetInnerHTML|child_process|shell: true|localStorage|sessionStorage'

human_review:
  - architecture-and-boundaries
  - functional-flow-and-error-semantics
  - data-storage-and-migration
  - security-and-privacy
  - reliability-performance-and-operability
  - test-coverage-and-release-readiness
  - desktop-ux-and-accessibility
  - documentation-and-product-scope

