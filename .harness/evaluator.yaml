  name: explicit-http-post-write-capability
  evaluator_frozen: true
  checks:
    - name: http-post-unit-and-policy
      type: command
      command: npm test -w @ax-studio/core -- --run src/modules/http/connector.test.ts src/design-tools/capability-invoke.test.ts src/runtime/capability-read.test.ts src/runtime/engine.test.ts src/workflow/approval.test.ts src/workflow/side-effect-resolve.test.ts
