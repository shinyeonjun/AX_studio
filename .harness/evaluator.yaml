version: 1
status: active
frozen: true

# Define checks before the first implementation experiment.
# Prefer commands that produce deterministic pass/fail or measurable output.
# Example:
# checks:
#   - name: targeted-regression
#     type: command
#     command: pytest tests/test_example.py -q
#     required: true
#   - name: full-test-suite
#     type: command
#     command: pytest -q
#     required: true
checks:
  - name: core-tests
    type: command
    command: npm test -w @ax-studio/core
    required: true
  - name: core-typecheck
    type: command
    command: npx tsc -p packages/core/tsconfig.json --noEmit
    required: true
  - name: desktop-typecheck
    type: command
    command: npx tsc -p apps/desktop/tsconfig.json --noEmit
    required: true
  - name: core-eval
    type: command
    command: npm run eval -w @ax-studio/core
    required: true
  - name: document-engine-tests
    type: command
    command: python -m unittest discover -s packages/document-engine/src -p '*_test.py' -v
    required: true
  - name: production-build
    type: command
    command: npm run build
    required: true
  - name: diff-whitespace
    type: command
    command: git diff --check
    required: true

# Optional numerical/structured metrics.
# Example:
# metrics:
#   - name: p95_latency_ms
#     direction: minimize
#     command: python benchmarks/run.py --json
#     json_path: $.p95_latency_ms
metrics: []

